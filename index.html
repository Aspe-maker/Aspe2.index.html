<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بطاقاتي التعليمية</title>

  <style>
    :root {
      --bg: #f5f7fc;
      --surface: #ffffff;
      --ink: #202943;
      --muted: #737d94;
      --line: #e6eaf2;
      --primary: #596ce6;
      --primary-dark: #4658d0;
      --soft: #eef0ff;
      --danger: #b42318;
      --shadow: 0 10px 30px rgba(36, 49, 91, .06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(ellipse at top right, #e9edff 0, transparent 34rem),
        var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.65;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }

    .app {
      width: min(1050px, 100%);
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 20px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: #fff;
      font-size: 23px;
      background: linear-gradient(135deg, #7787f5, #4d60dc);
      box-shadow: 0 8px 20px rgba(83, 102, 232, .22);
    }

    h1 { margin: 0; font-size: 1.38rem; }
    h2 { margin: 0; font-size: 1.12rem; }
    .subheading, .muted { color: var(--muted); }
    .subheading { margin: 3px 0 0; font-size: .9rem; }

    .toolbar, .row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
    }

    .panel {
      margin: 14px 0;
      padding: 20px;
      border: 1px solid #e8ebf3;
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .muted { font-size: .9rem; }

    .btn {
      min-height: 41px;
      padding: 9px 15px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: var(--primary);
      font-weight: 650;
      box-shadow: 0 3px 9px rgba(45, 58, 110, .07);
      transition: .18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: var(--primary-dark);
    }

    .btn.secondary {
      color: #4658c6;
      background: var(--soft);
      box-shadow: none;
    }

    .btn.secondary:hover { background: #e3e7ff; }

    .btn.ghost {
      color: #3e4861;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: none;
    }

    .btn.ghost:hover { background: #f8f9fd; }

    .btn.danger {
      color: var(--danger);
      background: #fff0ee;
      box-shadow: none;
    }

    .btn.danger:hover { background: #ffe4e0; }

    .btn.small {
      min-height: 35px;
      padding: 6px 11px;
      font-size: .88rem;
    }

    .section-create {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto;
      gap: 10px;
      margin-bottom: 15px;
    }

    .section-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .section-tab {
      padding: 9px 16px;
      border: 1px solid #e3e7f1;
      border-radius: 12px;
      color: #4c5670;
      background: #f9faff;
      transition: .2s ease;
    }

    .section-tab:hover {
      transform: translateY(-1px);
      border-color: #b9c2f7;
      background: #f1f3ff;
    }

    .section-tab.active {
      border-color: transparent;
      color: white;
      background: linear-gradient(135deg, #7180ef, #5264df);
      box-shadow: 0 6px 16px rgba(83, 102, 232, .22);
    }

    .input, .textarea {
      display: block;
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #e2e7f0;
      border-radius: 14px;
      outline: none;
      color: var(--ink);
      background: #fbfcff;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    .input:hover, .textarea:hover {
      border-color: #c6ceef;
      background: #fff;
    }

    .input:focus, .textarea:focus {
      border-color: #7182ef;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(83, 102, 232, .12);
    }

    .textarea {
      min-height: 105px;
      resize: vertical;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .field {
      display: grid;
      min-width: 0;
      gap: 8px;
    }

    .field > span {
      color: #303954;
      font-size: .92rem;
      font-weight: 650;
    }

    .file-input {
      width: 100%;
      padding: 12px;
      border: 1px dashed #c8d0e4;
      border-radius: 14px;
      color: #68728a;
      background: #f8f9ff;
      transition: .2s ease;
    }

    .file-input:hover {
      border-color: #7b89e8;
      background: #f1f3ff;
    }

    .help { color: var(--muted); font-size: .86rem; }
    .form-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; margin-top: 14px; }
    .status { color: var(--muted); font-size: .9rem; }

    .cards { display: grid; gap: 17px; }

    /* شكل البطاقة العصري */
    .flip-scene {
      perspective: 1100px;
      border-radius: 22px;
      transition: transform .22s ease;
    }

    .flip-scene:hover {
      transform: translateY(-3px);
    }

    .flashcard {
      position: relative;
      min-height: 235px;
      transform-style: preserve-3d;
      transition: transform .62s cubic-bezier(.2, .75, .25, 1);
      cursor: pointer;
      outline: none;
    }

    .flashcard.is-flipped {
      transform: rotateY(180deg);
    }

    .flashcard:focus-visible .card-face {
      outline: 2px solid #aab4ff;
      outline-offset: 2px;
    }

    .card-face {
      position: absolute;
      inset: 0;
      display: flex;
      min-height: 235px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 28px;
      border: 0;
      border-radius: 22px;
      text-align: center;
      background: linear-gradient(145deg, #fff, #f7f8ff);
      box-shadow: 0 8px 24px rgba(36, 49, 91, .07);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-face.answer-face {
      transform: rotateY(180deg);
      background: linear-gradient(145deg, #f0f2ff, #fff);
    }

    .face-label {
      align-self: flex-start;
      margin-bottom: 16px;
      padding: 5px 11px;
      border-radius: 999px;
      color: #596ce6;
      background: #eef0ff;
      font-size: .8rem;
    }

    .face-content {
      width: 100%;
      color: #27314c;
      font-size: 1.15rem;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .card-image {
      display: block;
      max-width: 100%;
      max-height: 280px;
      margin: 12px auto 0;
      border: 0;
      border-radius: 16px;
      object-fit: contain;
      background: #fff;
    }

    .flip-hint {
      padding-inline: 5px;
      margin-top: 8px;
      color: #858da1;
      font-size: .8rem;
    }

    .card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 9px; }

    .empty {
      padding: 28px 16px;
      border: 1px dashed #d7deeb;
      border-radius: 16px;
      color: var(--muted);
      background: #fafbff;
      text-align: center;
    }

    .empty-icon { display: block; margin-bottom: 6px; font-size: 30px; }
    .hidden { display: none !important; }

    .quiz-area { display: grid; gap: 12px; }

    .quiz-question {
      padding: 19px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fafbff;
      text-align: center;
    }

    .quiz-counter { margin-bottom: 8px; color: var(--muted); font-size: .9rem; }
    .quiz-prompt { font-size: 1.05rem; white-space: pre-wrap; }
    .quiz-prompt img { display: block; max-width: 100%; max-height: 220px; margin: 10px auto; }

    .quiz-options { display: grid; gap: 9px; }

    .quiz-option {
      padding: 12px 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: #fff;
      text-align: start;
      transition: .15s ease;
    }

    .quiz-option:hover:not(:disabled) {
      border-color: #98a5fa;
      background: #f8f9ff;
    }

    .feedback { min-height: 24px; font-weight: 700; }
    .correct { color: #16834b; }
    .incorrect { color: var(--danger); }

    @media (max-width: 650px) {
      .app { padding: 15px 11px 35px; }
      .panel { padding: 15px; }
      .form-grid, .section-create { grid-template-columns: 1fr; }
      .toolbar { width: 100%; }
      .toolbar .btn { flex: 1; }

      .card-face {
        min-height: 215px;
        padding: 20px 16px;
        border-radius: 19px;
      }

      .flashcard { min-height: 215px; }
      .face-content { font-size: 1.05rem; }
      .input, .textarea, .file-input { border-radius: 12px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">▣</div>
        <div>
          <h1 id="appTitle"></h1>
          <p class="subheading" id="appSubtitle"></p>
        </div>
      </div>

      <div class="toolbar">
        <button class="btn ghost" id="languageBtn" type="button"></button>
        <button class="btn ghost" id="directionBtn" type="button"></button>
      </div>
    </header>

    <section class="panel">
      <div class="panel-heading">
        <div>
          <h2 id="sectionsTitle"></h2>
          <div class="muted" id="sectionsHint"></div>
        </div>
      </div>

      <div class="section-create">
        <input class="input" id="newSectionInput" type="text">
        <button class="btn" id="addSectionBtn" type="button"></button>
      </div>

      <div class="section-tabs" id="sectionTabs"></div>
    </section>

    <section class="panel hidden" id="editorPanel">
      <div class="panel-heading">
        <div>
          <h2 id="editorTitle"></h2>
          <div class="muted" id="editorSubtitle"></div>
        </div>
      </div>

      <div class="form-grid">
        <label class="field">
          <span id="questionLabel"></span>
          <textarea class="textarea" id="questionText"></textarea>
        </label>

        <label class="field">
          <span id="answerLabel"></span>
          <textarea class="textarea" id="answerText"></textarea>
        </label>

        <label class="field">
          <span id="questionImageLabel"></span>
          <input class="file-input" id="questionImage" type="file" accept="image/*">
        </label>

        <label class="field">
          <span id="answerImageLabel"></span>
          <input class="file-input" id="answerImage" type="file" accept="image/*">
        </label>
      </div>

      <p class="help" id="imageHelp"></p>

      <div class="form-actions">
        <button class="btn" id="saveCardBtn" type="button"></button>
        <button class="btn secondary hidden" id="cancelEditBtn" type="button"></button>
        <span class="status" id="statusText"></span>
      </div>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <div>
          <h2 id="listTitle"></h2>
          <div class="muted" id="listSubtitle"></div>
        </div>

        <div class="toolbar">
          <button class="btn secondary hidden" id="mistakesBtn" type="button"></button>
          <button class="btn secondary hidden" id="backToCardsBtn" type="button"></button>
          <button class="btn" id="quizBtn" type="button"></button>
        </div>
      </div>

      <div id="cardList" class="cards"></div>
      <div id="quizArea" class="quiz-area hidden"></div>
    </section>
  </main>

  <script>
    "use strict";

    const APP_KEY = "study_cards_app_v3";
    const DB_NAME = "study_cards_images_v3";
    const DB_STORE = "images";

    const text = {
      ar: {
        title: "بطاقاتي التعليمية",
        subtitle: "أنشئ أقسامك وراجع بطاقاتك بسهولة",
        sections: "أقسام الدراسة",
        sectionsHint: "أنشئ قسمًا أولًا، ثم اختره لإضافة البطاقات.",
        sectionPlaceholder: "مثال: الفيزياء",
        addSection: "＋ إضافة قسم",
        editor: "إضافة بطاقة",
        editEditor: "تعديل البطاقة",
        editorHint: "أضف نصًا أو صورة للسؤال والإجابة.",
        question: "السؤال",
        answer: "الإجابة",
        questionPlaceholder: "اكتب السؤال هنا...",

        questionImage: "صورة السؤال (اختياري)",
        answerImage: "صورة الإجابة (اختياري)",
        imageHelp: "تُحفظ الصور في مساحة تخزين المتصفح، ولا يفرض الموقع حدًا قدره 2 ميغابايت.",

        emptyCards: "لا توجد بطاقات في هذا القسم بعد.",
        emptyMistakes: "لا توجد أخطاء محفوظة في هذا القسم.",
        clickAnswer: "اضغط لإظهار الإجابة",
        clickQuestion: "اضغط للعودة إلى السؤال",

        rename: "اكتب الاسم الجديد للقسم:",

        lastSection: "أضف قسمًا آخر قبل حذف هذا القسم.",
        cardNeedsSides: "أضف نصًا أو صورة لكل من السؤال والإجابة.",
        saved: "تم حفظ البطاقة.",
        saveError: "تعذّر الحفظ. قد تكون مساحة تخزين المتصفح ممتلئة.",
        needTwoCards: "أضف بطاقتين على الأقل لبدء الاختبار.",
        chooseAnswer: "اختر الإجابة الصحيحة:",
        questionNumber: "السؤال",
        correct: "إجابة صحيحة!",
        incorrect: "إجابة غير صحيحة؛ أُضيف السؤال إلى الأخطاء.",
        next: "التالي",
        score: "النتيجة",
        finished: "انتهى الاختبار",
        startAgain: "اختبار جديد",
        imageAnswer: "إجابة بصورة",
        deleteConfirm: "هل تريد حذف هذه البطاقة؟",
        languageButton: "English",
        directionButton: "⇄ اتجاه الكتابة",
        renameButton: "تسمية",
        deleteSection: "حذف القسم",
        flipHint: "اضغط على البطاقة لقلبها",
        imageError: "تعذر عرض الصورة."
      },
      en: {
        title: "My Study Cards",
        subtitle: "Create sections and review your cards",
        sections: "Study sections",
        sectionsHint: "Create a section first, then select it to add cards.",
        sectionPlaceholder: "Example: Physics",
        addSection: "＋ Add section",
        editor: "Add a card",
        editEditor: "Edit card",
        editorHint: "Add text or an image to the question and answer.",
        question: "Question",
        answer: "Answer",
        questionPlaceholder: "Write the question here...",
        answerPlaceholder: "Write the answer here...",
        questionImage: "Question image (optional)",
        answerImage: "Answer image (optional)",
        imageHelp: "Images use your browser's available storage; the site does not impose a 2 MB limit.",
        addCard: "Add card",
        save: "Save changes",
        cancel: "Cancel",
        cards: "Cards",
        listHint: "Click a card to flip it and reveal the answer.",
        mistakes: "Mistakes",
        allCards: "All cards",
        quiz: "Random quiz",
        noSection: "Add a section first to start creating cards.",
        emptyCards: "There are no cards in this section yet.",
        emptyMistakes: "There are no saved mistakes in this section.",
        clickAnswer: "Click to reveal the answer",
        clickQuestion: "Click to return to the question",
        edit: "Edit",
        delete: "Delete",
        moveBack: "Move back to cards",
        rename: "Enter the new section name:",
        confirmDelete: "Delete this section and all its cards and mistakes?",
        lastSection: "Add another section before deleting this one.",
        cardNeedsSides: "Add text or an image for both the question and the answer.",
        saved: "Card saved.",
        saveError: "Could not save. Browser storage may be full.",
        needTwoCards: "Add at least two cards to start a quiz.",
        chooseAnswer: "Choose the correct answer:",
        questionNumber: "Question",
        correct: "Correct!",
        incorrect: "Incorrect. The question was added to Mistakes.",
        next: "Next",
        score: "Score",
        finished: "Quiz complete",
        startAgain: "New quiz",
        imageAnswer: "Image answer",
        deleteConfirm: "Delete this card?",
        languageButton: "العربية",
        directionButton: "⇄ Text direction",
        renameButton: "Rename",
        deleteSection: "Delete section",
        flipHint: "Click the card to flip it",
        imageError: "Could not display the image."
      }
    };

    const $ = id => document.getElementById(id);
    const makeId = () => window.crypto?.randomUUID
      ? crypto.randomUUID()
      : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(APP_KEY));
        if (saved && Array.isArray(saved.sections)) {
          saved.progress ||= {};
          saved.language ||= "ar";
          saved.direction ||= saved.language === "ar" ? "rtl" : "ltr";
          saved.sections = saved.sections.map(section => ({
            id: section.id || makeId(),
            name: section.name || "قسم",
            cards: Array.isArray(section.cards) ? section.cards : [],
            mistakes: Array.isArray(section.mistakes) ? section.mistakes : []
          }));
          return saved;
        }
      } catch (error) {}
      return {
        sections: [],
        activeSectionId: null,
        language: "ar",
        direction: "rtl",
        progress: {}
      };
    }

    const state = loadState();
    let view = "cards";
    let editing = null;
    let quiz = null;
    let dbPromise = null;
    const imageUrls = new Set();

    const tr = key => text[state.language][key];
    const currentSection = () =>
      state.sections.find(section => section.id === state.activeSectionId) || null;

    function saveState() {
      try {
        localStorage.setItem(APP_KEY, JSON.stringify(state));
      } catch (error) {
        setStatus(tr("saveError"));
      }
    }

    function setStatus(message) {
      $("statusText").textContent = message || "";
    }

    function openImageDB() {
      if (!("indexedDB" in window)) {
        return Promise.reject(new Error("IndexedDB is unavailable"));
      }

      if (!dbPromise) {
        dbPromise = new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, 1);

          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains(DB_STORE)) {
              db.createObjectStore(DB_STORE);
            }
          };

          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      return dbPromise;
    }

    async function saveImage(file) {
      if (!file) return null;
      const db = await openImageDB();
      const id = makeId();

      await new Promise((resolve, reject) => {
        const transaction = db.transaction(DB_STORE, "readwrite");
        transaction.objectStore(DB_STORE).put(file, id);
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });

      return id;
    }

    async function getImageUrl(id) {
      if (!id) return null;
      const db = await openImageDB();

      const blob = await new Promise((resolve, reject) => {
        const request = db.transaction(DB_STORE, "readonly")
          .objectStore(DB_STORE).get(id);

        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
      });

      if (!blob) return null;
      const url = URL.createObjectURL(blob);
      imageUrls.add(url);
      return url;
    }

    async function removeImage(id) {
      if (!id) return;

      try {
        const db = await openImageDB();
        await new Promise((resolve, reject) => {
          const transaction = db.transaction(DB_STORE, "readwrite");
          transaction.objectStore(DB_STORE).delete(id);
          transaction.oncomplete = resolve;
          transaction.onerror = () => reject(transaction.error);
        });
      } catch (error) {}
    }

    function updateText() {
      document.documentElement.lang = state.language;
      document.documentElement.dir = state.direction;

      $("appTitle").textContent = tr("title");
      $("appSubtitle").textContent = tr("subtitle");
      $("sectionsTitle").textContent = tr("sections");
      $("sectionsHint").textContent = tr("sectionsHint");
      $("newSectionInput").placeholder = tr("sectionPlaceholder");
      $("addSectionBtn").textContent = tr("addSection");

      $("editorTitle").textContent = editing ? tr("editEditor") : tr("editor");
      $("editorSubtitle").textContent = tr("editorHint");
      $("questionLabel").textContent = tr("question");
      $("answerLabel").textContent = tr("answer");
      $("questionText").placeholder = tr("questionPlaceholder");
      $("answerText").placeholder = tr("answerPlaceholder");
      $("questionImageLabel").textContent = tr("questionImage");
      $("answerImageLabel").textContent = tr("answerImage");
      $("imageHelp").textContent = tr("imageHelp");
      $("saveCardBtn").textContent = editing ? tr("save") : tr("addCard");
      $("cancelEditBtn").textContent = tr("cancel");

      $("languageBtn").textContent = tr("languageButton");
      $("directionBtn").textContent = tr("directionButton");
      $("quizBtn").textContent = tr("quiz");
      $("mistakesBtn").textContent = tr("mistakes");
      $("backToCardsBtn").textContent = tr("allCards");
    }

    function renderSections() {
      const host = $("sectionTabs");
      host.replaceChildren();

      for (const section of state.sections) {
        const group = document.createElement("div");
        group.className = "row";

        const tab = document.createElement("button");
        tab.type = "button";
        tab.className = "section-tab" +
          (section.id === state.activeSectionId ? " active" : "");
        tab.textContent = section.name;

        tab.onclick = () => {
          state.activeSectionId = section.id;
          view = "cards";
          quiz = null;
          cancelEdit();
          saveState();
          render();
        };

        group.append(tab);

        if (section.id === state.activeSectionId) {
          const rename = document.createElement("button");
          rename.type = "button";
          rename.className = "btn ghost small";
          rename.textContent = tr("renameButton");
          rename.onclick = () => {
            const name = prompt(tr("rename"), section.name);
            if (name && name.trim()) {
              section.name = name.trim();
              saveState();
              renderSections();
            }
          };

          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "btn danger small";
          remove.textContent = tr("deleteSection");
          remove.onclick = () => deleteSection(section);

          group.append(rename, remove);
        }

        host.append(group);
      }
    }

    async function addSideContent(face, content, imageId) {
      if (content) {
        const textNode = document.createElement("div");
        textNode.className = "face-content";
        textNode.textContent = content;
        face.append(textNode);
      }

      if (imageId) {
        try {
          const url = await getImageUrl(imageId);
          if (url) {
            const image = document.createElement("img");
            image.className = "card-image";
            image.src = url;
            image.alt = "";
            face.append(image);
          }
        } catch (error) {
          const message = document.createElement("div");
          message.className = "muted";
          message.textContent = tr("imageError");
          face.append(message);
        }
      }
    }

    async function renderCards() {
      const host = $("cardList");
      host.replaceChildren();

      const section = currentSection();

      if (!section) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = tr("noSection");
        host.append(empty);
        return;
      }

      const list = view === "mistakes" ? section.mistakes : section.cards;

      if (!list.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = view === "mistakes" ? tr("emptyMistakes") : tr("emptyCards");
        host.append(empty);
        return;
      }

      for (const card of [...list]) {
        const shell = document.createElement("article");
        const scene = document.createElement("div");
        const flip = document.createElement("div");
        const questionFace = document.createElement("div");
        const answerFace = document.createElement("div");

        shell.className = "card-shell";
        scene.className = "flip-scene";
        flip.className = "flashcard";
        flip.tabIndex = 0;
        flip.setAttribute("role", "button");
        flip.setAttribute("aria-label", tr("clickAnswer"));

        questionFace.className = "card-face question-face";
        answerFace.className = "card-face answer-face";

        const qLabel = document.createElement("div");
        qLabel.className = "face-label";
        qLabel.textContent = tr("question");
        questionFace.append(qLabel);
        await addSideContent(questionFace, card.question, card.questionImage);

        const aLabel = document.createElement("div");
        aLabel.className = "face-label";
        aLabel.textContent = tr("answer");
        answerFace.append(aLabel);
        await addSideContent(answerFace, card.answer, card.answerImage);

        const toggle = () => {
          flip.classList.toggle("is-flipped");
          flip.setAttribute(
            "aria-label",
            flip.classList.contains("is-flipped") ? tr("clickQuestion") : tr("clickAnswer")
          );
        };

        flip.onclick = toggle;
        flip.onkeydown = event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggle();
          }
        };

        flip.append(questionFace, answerFace);
        scene.append(flip);

        const hint = document.createElement("div");
        hint.className = "flip-hint";
        hint.textContent = tr("flipHint");

        const actions = document.createElement("div");
        actions.className = "card-actions";

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.className = "btn secondary small";
        editButton.textContent = tr("edit");
        editButton.onclick = () => beginEdit(card);
        actions.append(editButton);

        if (view === "mistakes") {
          const moveButton = document.createElement("button");
          moveButton.type = "button";
          moveButton.className = "btn secondary small";
          moveButton.textContent = tr("moveBack");
          moveButton.onclick = () => moveMistakeBack(card.id);
          actions.append(moveButton);
        }

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "btn danger small";
        deleteButton.textContent = tr("delete");
        deleteButton.onclick = () => deleteCard(card.id);
        actions.append(deleteButton);

        shell.append(scene, hint, actions);
        host.append(shell);
      }
    }

    function render() {
      updateText();
      renderSections();

      const hasSection = !!currentSection();

      $("editorPanel").classList.toggle("hidden", !hasSection || !!quiz);
      $("quizBtn").classList.toggle("hidden", !hasSection || !!quiz);
      $("mistakesBtn").classList.toggle(
        "hidden", !hasSection || view === "mistakes" || !!quiz
      );
      $("backToCardsBtn").classList.toggle(
        "hidden", !hasSection || (view !== "mistakes" && !quiz)
      );

      $("cardList").classList.toggle("hidden", !!quiz);
      $("quizArea").classList.toggle("hidden", !quiz);
      $("listTitle").textContent = view === "mistakes" && !quiz
        ? tr("mistakes")
        : tr("cards");
      $("listSubtitle").textContent = quiz ? tr("chooseAnswer") : tr("listHint");

      renderCards();
      if (quiz) renderQuizQuestion();
    }

    function resetForm() {
      $("questionText").value = "";
      $("answerText").value = "";
      $("questionImage").value = "";
      $("answerImage").value = "";
    }

    function cancelEdit() {
      editing = null;
      resetForm();
      $("cancelEditBtn").classList.add("hidden");
    }

    function findCard(section, id) {
      return [...section.cards, ...section.mistakes]
        .find(card => card.id === id) || null;
    }

    function beginEdit(card) {
      editing = { cardId: card.id };
      $("questionText").value = card.question || "";
      $("answerText").value = card.answer || "";
      $("questionImage").value = "";
      $("answerImage").value = "";
      $("cancelEditBtn").classList.remove("hidden");
      updateText();
      $("editorPanel").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    $("addSectionBtn").onclick = () => {
      const name = $("newSectionInput").value.trim();
      if (!name) {
        $("newSectionInput").focus();
        return;
      }

      const section = {
        id: makeId(),
        name,
        cards: [],
        mistakes: []
      };

      state.sections.push(section);
      state.activeSectionId = section.id;
      $("newSectionInput").value = "";
      view = "cards";
      quiz = null;
      saveState();
      render();
    };

    $("newSectionInput").addEventListener("keydown", event => {
      if (event.key === "Enter") $("addSectionBtn").click();
    });

    async function deleteSection(section) {
      if (state.sections.length <= 1) {
        alert(tr("lastSection"));
        return;
      }

      if (!confirm(tr("confirmDelete"))) return;

      for (const card of [...section.cards, ...section.mistakes]) {
        await removeImage(card.questionImage);
        await removeImage(card.answerImage);
      }

      state.sections = state.sections.filter(item => item.id !== section.id);
      delete state.progress[section.id];
      state.activeSectionId = state.sections[0]?.id || null;
      view = "cards";
      quiz = null;
      cancelEdit();
      saveState();
      render();
    }

    $("saveCardBtn").onclick = async () => {
      const section = currentSection();
      if (!section) return;

      const question = $("questionText").value.trim();
      const answer = $("answerText").value.trim();
      const qFile = $("questionImage").files[0] || null;
      const aFile = $("answerImage").files[0] || null;
      const oldCard = editing ? findCard(section, editing.cardId) : null;

      const hasQuestion = question || qFile || oldCard?.questionImage;
      const hasAnswer = answer || aFile || oldCard?.answerImage;

      if (!hasQuestion || !hasAnswer) {
        alert(tr("cardNeedsSides"));
        return;
      }

      const button = $("saveCardBtn");
      button.disabled = true;
      setStatus(state.language === "ar" ? "جارٍ الحفظ..." : "Saving...");

      try {
        let questionImage = oldCard?.questionImage || null;
        let answerImage = oldCard?.answerImage || null;

        if (qFile) questionImage = await saveImage(qFile);
        if (aFile) answerImage = await saveImage(aFile);

        if (oldCard) {
          const previousQuestionImage = oldCard.questionImage;
          const previousAnswerImage = oldCard.answerImage;

          oldCard.question = question;
          oldCard.answer = answer;
          oldCard.questionImage = questionImage;
          oldCard.answerImage = answerImage;

          if (qFile && previousQuestionImage) await removeImage(previousQuestionImage);
          if (aFile && previousAnswerImage) await removeImage(previousAnswerImage);
        } else {
          section.cards.push({
            id: makeId(),
            question,
            answer,
            questionImage,
            answerImage
          });
        }

        saveState();
        cancelEdit();
        view = "cards";
        setStatus(tr("saved"));
        render();
      } catch (error) {
        console.error(error);
        setStatus(tr("saveError"));
        alert(tr("saveError"));
      } finally {
        button.disabled = false;
      }
    };

    $("cancelEditBtn").onclick = () => {
      cancelEdit();
      render();
    };

    async function deleteCard(id) {
      const section = currentSection();
      if (!section || !confirm(tr("deleteConfirm"))) return;

      for (const list of [section.cards, section.mistakes]) {
        const index = list.findIndex(card => card.id === id);
        if (index !== -1) {
          const [card] = list.splice(index, 1);
          await removeImage(card.questionImage);
          await removeImage(card.answerImage);
        }
      }

      saveState();
      render();
    }

    function moveMistakeBack(id) {
      const section = currentSection();
      if (!section) return;

      const index = section.mistakes.findIndex(card => card.id === id);
      if (index < 0) return;

      const [card] = section.mistakes.splice(index, 1);
      if (!section.cards.some(item => item.id === card.id)) {
        section.cards.push(card);
      }

      saveState();
      render();
    }

    $("mistakesBtn").onclick = () => {
      view = "mistakes";
      quiz = null;
      render();
    };

    $("backToCardsBtn").onclick = () => {
      view = "cards";
      quiz = null;
      render();
    };

    $("languageBtn").onclick = () => {
      state.language = state.language === "ar" ? "en" : "ar";
      state.direction = state.language === "ar" ? "rtl" : "ltr";
      saveState();
      render();
    };

    $("directionBtn").onclick = () => {
      state.direction = state.direction === "rtl" ? "ltr" : "rtl";
      saveState();
      render();
    };

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    $("quizBtn").onclick = startQuiz;

    function startQuiz() {
      const section = currentSection();
      if (!section) return;

      if (section.cards.length < 2) {
        alert(tr("needTwoCards"));
        return;
      }

      quiz = {
        ids: shuffle(section.cards.map(card => card.id)),
        index: 0,
        score: 0
      };

      render();
    }

    async function renderQuizQuestion() {
      if (!quiz) return;

      const area = $("quizArea");
      area.replaceChildren();

      const section = currentSection();
      if (!section) return;

      if (quiz.index >= quiz.ids.length) {
        const result = document.createElement("div");
        result.className = "quiz-question";

        const heading = document.createElement("h2");
        heading.textContent = tr("finished");

        const score = document.createElement("p");
        score.textContent = `${tr("score")}: ${quiz.score} / ${quiz.ids.length}`;

        const again = document.createElement("button");
        again.type = "button";
        again.className = "btn";
        again.textContent = tr("startAgain");
        again.onclick = startQuiz;

        const exit = document.createElement("button");
        exit.type = "button";
        exit.className = "btn secondary";
        exit.style.marginInlineStart = "8px";
        exit.textContent = tr("allCards");
        exit.onclick = () => {
          quiz = null;
          view = "cards";
          render();
        };

        result.append(heading, score, again, exit);
        area.append(result);

        state.progress[section.id] = {
          score: quiz.score,
          total: quiz.ids.length,
          date: new Date().toISOString()
        };
        saveState();
        return;
      }

      const card = section.cards.find(item => item.id === quiz.ids[quiz.index]);
      if (!card) {
        quiz.index++;
        renderQuizQuestion();
        return;
      }

      const questionBox = document.createElement("div");
      questionBox.className = "quiz-question";

      const counter = document.createElement("div");
      counter.className = "quiz-counter";
      counter.textContent = `${tr("questionNumber")} ${quiz.index + 1} / ${quiz.ids.length}`;

      const prompt = document.createElement("div");
      prompt.className = "quiz-prompt";
      prompt.textContent = card.question || "";
      questionBox.append(counter, prompt);

      if (card.questionImage) {
        try {
          const url = await getImageUrl(card.questionImage);
          if (url && quiz) {
            const image = document.createElement("img");
            image.src = url;
            image.alt = "";
            prompt.append(image);
          }
        } catch (error) {}
      }

      const choose = document.createElement("div");
      choose.className = "muted";
      choose.textContent = tr("chooseAnswer");

      const optionsBox = document.createElement("div");
      optionsBox.className = "quiz-options";

      const feedback = document.createElement("div");
      feedback.className = "feedback";

      const wrongAnswers = shuffle(
        section.cards.filter(item => item.id !== card.id)
      ).slice(0, 3);

      const options = shuffle([card, ...wrongAnswers]);
      let answered = false;

      for (const option of options) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "quiz-option";
        button.textContent = option.answer || tr("imageAnswer");

        if (option.answerImage) {
          try {
            const url = await getImageUrl(option.answerImage);
            if (url) {
              const image = document.createElement("img");
              image.src = url;
              image.alt = "";
              image.style.cssText =
                "display:block;max-width:100%;max-height:110px;margin-top:8px";
              button.append(image);
            }
          } catch (error) {}
        }

        button.onclick = () => {
          if (answered) return;
          answered = true;

          if (option.id === card.id) {
            quiz.score++;
            feedback.textContent = tr("correct");
            feedback.className = "feedback correct";
          } else {
            feedback.textContent = tr("incorrect");
            feedback.className = "feedback incorrect";

            if (!section.mistakes.some(item => item.id === card.id)) {
              section.mistakes.push(card);
            }
            saveState();
          }

          optionsBox.querySelectorAll("button").forEach(item => {
            item.disabled = true;
          });
          nextButton.hidden = false;
        };

        optionsBox.append(button);
      }

      const nextButton = document.createElement("button");
      nextButton.type = "button";
      nextButton.className = "btn";
      nextButton.textContent = tr("next");
      nextButton.hidden = true;
      nextButton.onclick = () => {
        quiz.index++;
        renderQuizQuestion();
      };

      area.append(questionBox, choose, optionsBox, feedback, nextButton);
    }

    window.addEventListener("beforeunload", () => {
      for (const url of imageUrls) URL.revokeObjectURL(url);
    });

    render();
  </script>
</body>
</html>
