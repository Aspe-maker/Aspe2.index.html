<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بطاقاتي التعليمية</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6fb;
      --panel: #fff;
      --text: #172033;
      --muted: #68738a;
      --primary: #465ce5;
      --border: #e1e6f0;
      --danger: #c0392b;
      --shadow: 0 8px 24px #18264a12;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { max-width: 1100px; margin: auto; padding: 20px; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin-bottom: 18px;
    }
    h1, h2, h3 { line-height: 1.3; }
    h1 { margin: 0; font-size: 1.6rem; }
    h2 { margin: 0 0 12px; font-size: 1.2rem; }
    .muted { color: var(--muted); font-size: .93rem; }
    .panel {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 16px; padding: 18px; margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .grow { flex: 1; }
    input, textarea {
      width: 100%; border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; background: #fff; color: var(--text);
    }
    textarea { min-height: 78px; resize: vertical; }
    .field { display: grid; gap: 6px; flex: 1; min-width: 200px; }
    button {
      border: 0; border-radius: 10px; padding: 9px 14px;
      background: var(--primary); color: white;
    }
    button.secondary { background: #edf0ff; color: #293bb0; }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    button.danger { background: #fff0ef; color: var(--danger); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    .tab.active { background: var(--primary); color: white; }
    .section-name { min-width: 170px; max-width: 300px; }
    .card-list { display: grid; gap: 14px; }
    .card-item { perspective: 1000px; }
    .flip-card {
      position: relative; min-height: 230px; transform-style: preserve-3d;
      transition: transform .55s; cursor: pointer; outline: none;
    }
    .flip-card.flipped { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0; min-height: 230px; padding: 18px;
      border: 1px solid var(--border); border-radius: 16px; background: white;
      box-shadow: var(--shadow); backface-visibility: hidden;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; overflow: hidden;
    }
    .face.back { transform: rotateY(180deg); background: #f5f6ff; }
    .face img { max-width: 100%; max-height: 230px; object-fit: contain; margin-top: 10px; }
    .face-text { white-space: pre-wrap; overflow-wrap: anywhere; }
    .face-label { color: var(--muted); font-size: .82rem; margin-bottom: 8px; }
    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 9px; }
    .empty { padding: 20px; text-align: center; color: var(--muted); }
    .quiz-box { display: grid; gap: 12px; }
    .quiz-question { border: 1px solid var(--border);احفظ الكود كاملًا باسم `index.html` وافتحه في المتصفح. يمكنك تصفح البطاقات وقلبها بالضغط عليها من دون بدء اختبار. تُحفظ الصور في `IndexedDB`، والبطاقات والأقسام والتقدم في `localStorage`. سعة الصور المتاحة تعتمد على المتصفح ومساحة الجهاز.

<body>
<div class="app">
  <header>
    <h1 id="title">بطاقاتي التعليمية</h1>
    <div class="row">
      <button class="secondary" id="languageBtn">English</button>
      <button class="secondary" id="directionBtn">⇄ RTL / LTR</button>
    </div>
  </header>

  <section class="panel">
    <h2 id="sectionsHeading">الأقسام</h2>
    <div class="row">
      <input id="newSectionName" class="grow" placeholder="اسم القسم الجديد">
      <button id="addSectionBtn">إضافة قسم</button>
      <button id="renameSectionBtn" class="secondary">إعادة تسمية القسم</button>
      <button id="deleteSectionBtn" class="danger">حذف القسم</button>
    </div>
    <div id="sectionTabs" class="tabs"></div>
  </section>

  <section class="panel">
    <h2 id="formHeading">إضافة بطاقة</h2>
    <div class="form-grid">
      <label class="field"><span id="questionLabel">السؤال</span>
        <textarea id="questionText"></textarea>
      </label>
      <label class="field"><span id="answerLabel">الإجابة</span>
        <textarea id="answerText"></textarea>
      </label>
      <label class="field"><span id="questionImageLabel">صورة السؤال (اختياري)</span>
        <input id="questionImage" type="file" accept="image/\*">
      </label>
      <label class="field"><span id="answerImageLabel">صورة الإجابة (اختياري)</span>
        <input id="answerImage" type="file" accept="image/\*">
      </label>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="saveCardBtn">إضافة البطاقة</button>
      <button id="cancelEditBtn" class="secondary hidden">إلغاء التعديل</button>
      <span id="storageStatus" class="muted"></span>
    </div>
  </section>

  <section class="panel">
    <div class="row">
      <h2 id="cardsHeading" class="grow">البطاقات</h2>
      <button id="startQuizBtn">اختبار عشوائي</button>
      <button id="showCardsBtn" class="secondary hidden">عرض البطاقات</button>
      <button id="showMistakesBtn" class="secondary">الأخطاء</button>
    </div>
    <p id="flipHint" class="muted">اضغط على البطاقة لقلبها وإظهار الإجابة.</p>
    <div id="quizBox" class="quiz-box hidden"></div>
    <div id="cardList" class="card-list"></div>
  </section>
</div>

<script>
(() => {
  "use strict";

  const STORAGE\_KEY = "flashcards\_app\_v1";
  const DB\_NAME = "flashcards\_images\_v1";
  const DB\_STORE = "images";

  const text = {
    ar: {
      title:"بطاقاتي التعليمية", sections:"الأقسام", newSection:"اسم القسم الجديد",
      addSection:"إضافة قسم", rename:"إعادة تسمية القسم", deleteSection:"حذف القسم",
      addCard:"إضافة بطاقة", editCard:"تعديل بطاقة", question:"السؤال", answer:"الإجابة",
      qImage:"صورة السؤال (اختياري)", aImage:"صورة الإجابة (اختياري)",
      cards:"البطاقات", quiz:"اختبار عشوائي", showCards:"عرض البطاقات",
      mistakes:"الأخطاء", flip:"اضغط على البطاقة لقلبها وإظهار الإجابة.",
      empty:"لا توجد بطاقات في هذا القسم بعد.", emptyMistakes:"لا توجد أخطاء محفوظة لهذا القسم.",
      clickAnswer:"اضغط لإظهار الإجابة", clickQuestion:"اضغط للعودة إلى السؤال",
      save:"حفظ التعديلات", add:"إضافة البطاقة", cancel:"إلغاء التعديل",
      edit:"تعديل", remove:"حذف", moveBack:"إعادة إلى البطاقات",
      sectionPrompt:"اكتب اسم القسم:", confirmDelete:"هل تريد حذف القسم وكل بطاقاته وأخطائه؟",
      needCards:"أضف بطاقتين على الأقل لبدء الاختبار.", questionNumber:"السؤال",
      correct:"إجابة صحيحة!", incorrect:"إجابة غير صحيحة. أُضيفت إلى الأخطاء.",
      finish:"انتهى الاختبار", score:"النتيجة", next:"التالي", restart:"اختبار جديد",
      choose:"اختر الإجابة الصحيحة:", noAnswer:"اكتب سؤالًا أو أضف صورة للسؤال، واكتب إجابة أو أضف صورة للإجابة.",
      deleted:"تم حذف البطاقة.", saved:"تم الحفظ.", imageError:"تعذّر حفظ الصورة. تحقق من مساحة المتصفح.",
      langButton:"English", all:"كل البطاقات", addMistake:"أُضيفت البطاقة إلى الأخطاء.",
      quizDone:"انتهى الاختبار."
    },
    en: {
      title:"My Study Cards", sections:"Sections", newSection:"New section name",
      addSection:"Add section", rename:"Rename section", deleteSection:"Delete section",
      addCard:"Add card", editCard:"Edit card", question:"Question", answer:"Answer",
      qImage:"Question image (optional)", aImage:"Answer image (optional)",
      cards:"Cards", quiz:"Random quiz", showCards:"Show cards",
      mistakes:"Mistakes", flip:"Click a card to flip it and reveal the answer.",
      empty:"No cards in this section yet.", emptyMistakes:"No saved mistakes in this section.",
      clickAnswer:"Click to reveal the answer", clickQuestion:"Click to return to the question",
      save:"Save changes", add:"Add card", cancel:"Cancel edit",
      edit:"Edit", remove:"Delete", moveBack:"Move back to cards",
      sectionPrompt:"Enter a section name:", confirmDelete:"Delete this section and all its cards and mistakes?",
      needCards:"Add at least two cards to start a quiz.", questionNumber:"Question",
      correct:"Correct!", incorrect:"Incorrect. Added to Mistakes.",
      finish:"Quiz complete", score:"Score", next:"Next", restart:"New quiz",
      choose:"Choose the correct answer:", noAnswer:"Add question text or an image, and answer text or an image.",
      deleted:"Card deleted.", saved:"Saved.", imageError:"Could not save the image. Check available browser storage.",
      langButton:"العربية", all:"All cards", addMistake:"Added to Mistakes.",
      quizDone:"Quiz complete."
    }
  };

  let state = loadState();
  let language = state.language || "ar";
  let activeSectionId = state.activeSectionId || state.sections[0]?.id;
  let view = "cards";
  let editingId = null;
  let quiz = null;
  const objectUrls = new Set();
  let dbPromise;

  const \$ = id => document.getElementById(id);
  const uid = () => crypto.randomUUID ? crypto.randomUUID() :
    "id\_" + Date.now() + "\_" + Math.random().toString(16).slice(2);
  const t = key => text[language][key];

  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE\_KEY));
      if (saved && Array.isArray(saved.sections)) return saved;
    } catch (e) {}
    const first = { id: uid(), name: "عام", cards: [], mistakes: [] };
    return { sections: [first], activeSectionId: first.id, language: "ar", progress: {} };
  }

  function persist() {
    state.activeSectionId = activeSectionId;
    state.language = language;
    try {
      localStorage.setItem(STORAGE\_KEY, JSON.stringify(state));
    } catch (e) {
      alert("تعذر حفظ البيانات النصية في المتصفح.");
    }
  }

  function currentSection() {
    return state.sections.find(s => s.id === activeSectionId) || state.sections[0];
  }

  function openDB() {
    if (!("indexedDB" in window)) return Promise.reject(new Error("IndexedDB unavailable"));
    if (!dbPromise) {
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB\_NAME, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(DB\_STORE))
            req.result.createObjectStore(DB\_STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    return dbPromise;
  }

  async function putImage(file) {
    if (!file) return null;
    const db = await openDB();
    const id = uid();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(DB\_STORE, "readwrite");
      tx.objectStore(DB\_STORE).put(file, id);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
    return id;
  }

  async function getImageUrl(id) {
    if (!id) return "";
    const db = await openDB();
    const blob = await new Promise((resolve, reject) => {
      const req = db.transaction(DB\_STORE, "readonly").objectStore(DB\_STORE).get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
    if (!blob) return "";
    const url = URL.createObjectURL(blob);
    objectUrls.add(url);
    return url;
  }

  async function deleteImage(id) {
    if (!id) return;
    try {
      const db = await openDB();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(DB\_STORE, "readwrite");
        tx.objectStore(DB\_STORE).delete(id);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    } catch (e) {}
  }

  function updateLanguage() {
    document.documentElement.lang = language;
    document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
    \$("title").textContent = t("title");
    \$("sectionsHeading").textContent = t("sections");
    \$("newSectionName").placeholder = t("newSection");
    \$("addSectionBtn").textContent = t("addSection");
    \$("renameSectionBtn").textContent = t("rename");
    \$("deleteSectionBtn").textContent = t("deleteSection");
    \$("formHeading").textContent = editingId ? t("editCard") : t("addCard");
    \$("questionLabel").textContent = t("question");
    \$("answerLabel").textContent = t("answer");
    \$("questionImageLabel").textContent = t("qImage");
    \$("answerImageLabel").textContent = t("aImage");
    \$("cardsHeading").textContent = view === "mistakes" ? t("mistakes") : t("cards");
    \$("startQuizBtn").textContent = t("quiz");
    \$("showCardsBtn").textContent = t("showCards");
    \$("showMistakesBtn").textContent = t("mistakes");
    \$("flipHint").textContent = t("flip");
    \$("languageBtn").textContent = t("langButton");
    \$("saveCardBtn").textContent = editingId ? t("save") : t("add");
    \$("cancelEditBtn").textContent = t("cancel");
  }

  function renderTabs() {
    const host = \$("sectionTabs");
    host.replaceChildren();
    state.sections.forEach(section => {
      const button = document.createElement("button");
      button.className = "tab" + (section.id === activeSectionId ? " active" : "");
      button.textContent = section.name;
      button.onclick = () => {
        activeSectionId = section.id;
        view = "cards";
        quiz = null;
        \$("quizBox").classList.add("hidden");
        \$("showCardsBtn").classList.add("hidden");
        persist();
        render();
      };
      host.append(button);
    });
  }

  async function renderCards() {
    const host = \$("cardList");
    host.replaceChildren();
    const section = currentSection();
    if (!section) return;
    const cards = view === "mistakes" ? section.mistakes : section.cards;
    if (!cards.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = view === "mistakes" ? t("emptyMistakes") : t("empty");
      host.append(empty);
      return;
    }

    for (const card of cards) {
      const wrap = document.createElement("article");
      wrap.className = "card-wrap";

      const flip = document.createElement("div");
      flip.className = "flip-card";
      flip.tabIndex = 0;
      flip.setAttribute("role", "button");
      flip.setAttribute("aria-label", t("clickAnswer"));

      const front = document.createElement("div");
      front.className = "face front";
      front.innerHTML = `<div class="label">${escapeHtml(t("question"))} · ${escapeHtml(t("clickAnswer"))}</div>`;
      await addContent(front, card.question, card.questionImage);

      const back = document.createElement("div");
      back.className = "face back";
      back.innerHTML = `<div class="label">${escapeHtml(t("answer"))} · ${escapeHtml(t("clickQuestion"))}</div>`;
      await addContent(back, card.answer, card.answerImage);

      const toggle = () => flip.classList.toggle("flipped");
      flip.onclick = toggle;
      flip.onkeydown = e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      };
      flip.append(front, back);
      wrap.append(flip);

      const actions = document.createElement("div");
      actions.className = "card-actions";
      const edit = document.createElement("button");
      edit.className = "secondary";
      edit.textContent = t("edit");
      edit.onclick = () => beginEdit(card);
      actions.append(edit);

      if (view === "mistakes") {
        const move = document.createElement("button");
        move.className = "secondary";
        move.textContent = t("moveBack");
        move.onclick = () => moveMistakeBack(card.id);
        actions.append(move);
      }

      const del = document.createElement("button");
      del.className = "danger";
      del.textContent = t("remove");
      del.onclick = () => removeCard(card.id, view === "mistakes");
      actions.append(del);
      wrap.append(actions);
      host.append(wrap);
    }
  }

  async function addContent(face, content, imageId) {
    if (content) {
      const p = document.createElement("div");
      p.className = "face-text";
      p.textContent = content;
      face.append(p);
    }
    if (imageId) {
      try {
        const url = await getImageUrl(imageId);
        if (url) {
          const img = document.createElement("img");
          img.src = url;
          img.alt = "";
          face.append(img);
        }
      } catch (e) {}
    }
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, ch => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[ch]));
  }

  function render() {
    updateLanguage();
    renderTabs();
    renderCards();
    \$("showMistakesBtn").classList.toggle("hidden", view === "mistakes" || !!quiz);
    \$("showCardsBtn").classList.toggle("hidden", view !== "mistakes" && !quiz);
    \$("flipHint").classList.toggle("hidden", !!quiz);
  }

  function clearForm() {
    \$("questionText").value = "";
    \$("answerText").value = "";
    \$("questionImage").value = "";
    \$("answerImage").value = "";
    editingId = null;
    \$("cancelEditBtn").classList.add("hidden");
    updateLanguage();
  }

  function beginEdit(card) {
    editingId = card.id;
    \$("questionText").value = card.question || "";
    \$("answerText").value = card.answer || "";
    \$("questionImage").value = "";
    \$("answerImage").value = "";
    \$("cancelEditBtn").classList.remove("hidden");
    updateLanguage();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  \$("saveCardBtn").onclick = async () => {
    const section = currentSection();
    if (!section) return;
    const question = \$("questionText").value.trim();
    const answer = \$("answerText").value.trim();
    const qFile = \$("questionImage").files[0];
    const aFile = \$("answerImage").files[0];
    if (!question && !qFile && !answer && !aFile) {
      alert(t("noAnswer"));
      return;
    }
    if ((!question && !qFile) || (!answer && !aFile)) {
      alert(t("noAnswer"));
      return;
    }

    \$("saveCardBtn").disabled = true;
    \$("storageStatus").textContent = "...";
    try {
      let old = editingId ? section.cards.find(c => c.id === editingId) : null;
      if (!old && editingId) old = section.mistakes.find(c => c.id === editingId);

      const qImage = qFile ? await putImage(qFile) : (old?.questionImage || null);
      const aImage = aFile ? await putImage(aFile) : (old?.answerImage || null);

      if (old) {
        old.question = question;
        old.answer = answer;
        old.questionImage = qImage;
        old.answerImage = aImage;
        if (qFile && old.questionImage !== qImage) await deleteImage(old.questionImage);
        if (aFile && old.answerImage !== aImage) await deleteImage(old.answerImage);
      } else {
        section.cards.push({
          id: uid(), question, answer, questionImage: qImage, answerImage: aImage
        });
      }
      persist();
      clearForm();
      \$("storageStatus").textContent = t("saved");
      render();
    } catch (e) {
      \$("storageStatus").textContent = t("imageError");
      alert(t("imageError"));
    } finally {
      \$("saveCardBtn").disabled = false;
    }
  };

  \$("cancelEditBtn").onclick = clearForm;

  \$("addSectionBtn").onclick = () => {
    const name = \$("newSectionName").value.trim();
    if (!name) return;
    const section = { id: uid(), name, cards: [], mistakes: [] };
    state.sections.push(section);
    activeSectionId = section.id;
    \$("newSectionName").value = "";
    view = "cards";
    persist();
    render();
  };

  \$("renameSectionBtn").onclick = () => {
    const section = currentSection();
    if (!section) return;
    const name = prompt(t("sectionPrompt"), section.name);
    if (name && name.trim()) {
      section.name = name.trim();
      persist();
      render();
    }
  };

  \$("deleteSectionBtn").onclick = async () => {
    const section = currentSection();
    if (!section || state.sections.length < 2) {
      alert(language === "ar" ? "يجب أن يبقى قسم واحد على الأقل." : "At least one section must remain.");
      return;
    }
    if (!confirm(t("confirmDelete"))) return;
    for (const card of [...section.cards, ...section.mistakes]) {
      await deleteImage(card.questionImage);
      await deleteImage(card.answerImage);
    }
    state.sections = state.sections.filter(s => s.id !== section.id);
    activeSectionId = state.sections[0].id;
    view = "cards";
    persist();
    render();
  };

  function removeCard(id, fromMistakes) {
    const section = currentSection();
    const list = fromMistakes ? section.mistakes : section.cards;
    const index = list.findIndex(c => c.id === id);
    if (index < 0) return;
    const card = list.splice(index, 1)[0];
    deleteImage(card.questionImage);
    deleteImage(card.answerImage);
    persist();
    render();
  }

  function moveMistakeBack(id) {
    const section = currentSection();
    const index = section.mistakes.findIndex(c => c.id === id);
    if (index < 0) return;
    const card = section.mistakes.splice(index, 1)[0];
    if (!section.cards.some(c => c.id === card.id)) section.cards.push(card);
    persist();
    render();
  }

  \$("showMistakesBtn").onclick = () => {
    view = "mistakes";
    quiz = null;
    \$("quizBox").classList.add("hidden");
    \$("cardList").classList.remove("hidden");
    render();
  };

  \$("showCardsBtn").onclick = () => {
    view = "cards";
    quiz = null;
    \$("quizBox").classList.add("hidden");
    \$("cardList").classList.remove("hidden");
    render();
  };

  \$("languageBtn").onclick = () => {
    language = language === "ar" ? "en" : "ar";
    persist();
    render();
  };
  \$("directionBtn").onclick = () => {
    document.documentElement.dir =
      document.documentElement.dir === "rtl" ? "ltr" : "rtl";
  };

  \$("startQuizBtn").onclick = () => {
    const section = currentSection();
    if (section.cards.length < 2) {
      alert(t("needCards"));
      return;
    }
    const order = section.cards.map(c => c.id).sort(() => Math.random() - .5);
    quiz = { order, index: 0, score: 0, answered: false };
    view = "cards";
    \$("cardList").classList.add("hidden");
    \$("quizBox").classList.remove("hidden");
    \$("showCardsBtn").classList.remove("hidden");
    \$("showMistakesBtn").classList.add("hidden");
    renderQuizQuestion();
  };

  function renderQuizQuestion() {
    const box = \$("quizBox");
    box.replaceChildren();
    const section = currentSection();
    if (quiz.index >= quiz.order.length) {
      const result = document.createElement("div");
      result.className = "panel";
      result.innerHTML = \`<h2>\${escapeHtml(t("finish"))}</h2>
        <p>\${escapeHtml(t("score"))}: \${quiz.score} / \${quiz.order.length}</p>\`;
      const again = document.createElement("button");
      again.textContent = t("restart");
      again.onclick = \$("startQuizBtn").onclick;
      box.append(result, again);
      state.progress[section.id] = {
        score: quiz.score, total: quiz.order.length, date: new Date().toISOString()
      };
      persist();
      return;
    }

    const card = section.cards.find(c => c.id === quiz.order[quiz.index]);
    const panel = document.createElement("div");
    panel.className = "panel";
    const heading = document.createElement("h2");
    heading.textContent = `${t("questionNumber")} ${quiz.index + 1} / ${quiz.order.length}`;
    const prompt = document.createElement("p");
    prompt.textContent = t("choose");
    const question = document.createElement("div");
    question.className = "face-text";
    question.style.textAlign = "center";
    question.textContent = card.question;
    panel.append(heading, prompt, question);
    if (card.questionImage) {
      getImageUrl(card.questionImage).then(url => {
        if (url) {
          const img = document.createElement("img");
          img.src = url; img.alt = ""; img.style.cssText = "display:block;max-width:100%;max-height:220px;margin:12px auto";
          panel.append(img);
        }
      });
    }

    const options = document.createElement("div");
    options.className = "quiz-options";
    const distractors = section.cards.filter(c => c.id !== card.id)
      .sort(() => Math.random() - .5).slice(0, 3);
    const choices = [card, ...distractors].sort(() => Math.random() - .5);
    const feedback = document.createElement("div");
    feedback.className = "feedback";

    choices.forEach(choice => {
      const btn = document.createElement("button");
      btn.className = "secondary";
      btn.textContent = choice.answer || (language === "ar" ? "إجابة مصورة" : "Image answer");
      btn.onclick = () => {
        if (quiz.answered) return;
        quiz.answered = true;
        if (choice.id === card.id) {
          quiz.score++;
          feedback.textContent = t("correct");
          feedback.style.color = "green";
        } else {
          feedback.textContent = t("incorrect");
          feedback.style.color = "#b42318";
          if (!section.mistakes.some(c => c.id === card.id))
            section.mistakes.push(card);
          persist();
        }
        [...options.querySelectorAll("button")].forEach(b => b.disabled = true);
        next.hidden = false;
      };
      options.append(btn);
    });

    const next = document.createElement("button");
    next.textContent = t("next");
    next.hidden = true;
    next.onclick = () => {
      quiz.index++;
      quiz.answered = false;
      renderQuizQuestion();
    };
    box.append(panel, options, feedback, next);
  }

  function render() {
    updateLanguage();
    renderTabs();
    renderCards();
    \$("showMistakesBtn").classList.toggle("hidden", view === "mistakes" || !!quiz);
    \$("showCardsBtn").classList.toggle("hidden", view !== "mistakes" && !quiz);
    \$("flipHint").classList.toggle("hidden", !!quiz);
  }

  // إعادة ضبط عنصر الملف تسمح باختيار نفس الصورة مرة أخرى.
  \$("questionImage").addEventListener("click", e => { e.currentTarget.value = ""; });
  \$("answerImage").addEventListener("click", e => { e.currentTarget.value = ""; });

  window.addEventListener("beforeunload", () => {
    for (const url of objectUrls) URL.revokeObjectURL(url);
  });

  if (!state.progress) state.progress = {};
  if (!state.sections.length) {
    const section = { id: uid(), name: "عام", cards: [], mistakes: [] };
    state.sections.push(section);
    activeSectionId = section.id;
  }
  if (!state.sections.some(s => s.id === activeSectionId))
    activeSectionId = state.sections[0].id;

  persist();
  render();
})();
</script>
</body>
</html>
