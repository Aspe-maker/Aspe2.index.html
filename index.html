<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بطاقاتي | Flashcards</title>

  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --text: #202938;
      --muted: #748094;
      --line: #e7eaf0;
      --primary: #5b6cf9;
      --primary-dark: #4656df;
      --soft-primary: #eef0ff;
      --green: #16835d;
      --soft-green: #e9f8f1;
      --red: #c74444;
      --soft-red: #fff0ef;
      --shadow: 0 12px 32px rgba(25, 35, 55, .09);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    .app-header {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 800;
      font-size: 20px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      color: white;
      background: linear-gradient(135deg, #7885ff, #5967ec);
    }

    .header-actions, .toolbar, .button-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      min-height: calc(100vh - 74px);
    }

    [dir="ltr"] .app-layout {
      grid-template-columns: minmax(0, 1fr) 270px;
    }

    .sidebar {
      padding: 22px 16px;
      background: #fff;
      border-inline-end: 1px solid var(--line);
    }

    [dir="ltr"] .sidebar { order: 2; }
    [dir="ltr"] .workspace { order: 1; }

    .sidebar-heading {
      margin: 4px 10px 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .section-list {
      display: grid;
      gap: 7px;
    }

    .section-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px;
      border-radius: 13px;
      transition: background .2s;
    }

    .section-item.active { background: var(--soft-primary); }

    .section-select {
      flex: 1;
      min-width: 0;
      padding: 8px 9px;
      text-align: start;
      color: var(--text);
      background: transparent;
      border: 0;
      font-weight: 650;
    }

    .section-count {
      margin-inline-start: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .section-tools {
      display: flex;
      gap: 2px;
    }

    .workspace { min-width: 0; padding: 28px; }

    .workspace-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }

    h1 { margin: 0 0 6px; font-size: clamp(23px, 3vw, 30px); }
    .subtitle { margin: 0; color: var(--muted); }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 40px;
      padding: 9px 14px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      transition: .18s ease;
    }

    .button:hover { background: var(--primary-dark); transform: translateY(-1px); }

    .button.secondary {
      background: #fff;
      color: var(--text);
      border-color: var(--line);
    }

    .button.secondary:hover { background: #f8f9fc; }

    .button.danger {
      color: var(--red);
      background: var(--soft-red);
    }

    .button.small { min-height: 34px; padding: 6px 10px; font-size: 13px; }

    .icon-button {
      width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      padding: 0;
      color: var(--muted);
      border: 0;
      border-radius: 10px;
      background: transparent;
    }

    .icon-button:hover { background: rgba(50, 60, 80, .08); color: var(--text); }

    .tabs {
      display: flex;
      gap: 7px;
      padding: 5px;
      margin-bottom: 20px;
      width: fit-content;
      max-width: 100%;
      overflow-x: auto;
      background: #eceedf;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .tab {
      white-space: nowrap;
      padding: 9px 14px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 10px;
      font-weight: 700;
    }

    .tab.active {
      color: var(--text);
      background: white;
      box-shadow: 0 2px 8px rgba(30, 40, 60, .08);
    }

    .panel {
      padding: 22px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 5px 18px rgba(25, 35, 55, .04);
    }

    .study-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(250px, .65fr);
      gap: 22px;
      align-items: start;
    }

    .card-stage {
      min-width: 0;
      perspective: 1200px;
    }

    /* البطاقة: واضحة، ناعمة الحواف، وتحافظ على القلب ثلاثي الأبعاد */
    .flashcard {
      width: 100%;
      min-height: 330px;
      perspective: 1200px;
      border-radius: 24px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      min-height: 330px;
      transform-style: preserve-3d;
      transition: transform .65s cubic-bezier(.2, .75, .25, 1);
    }

    .flashcard.is-flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      padding: 32px;
      overflow: auto;
      text-align: center;
      background: #fff;
      border: 1px solid #e3e7ef;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(25, 35, 55, .10);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transition: box-shadow .2s;
    }

    .flashcard:hover .flashcard-face {
      box-shadow: 0 17px 42px rgba(25, 35, 55, .14);
    }

    .flashcard-face.back {
      transform: rotateY(180deg);
      background: #f8faff;
      border-color: #dce4ff;
    }

    .face-label {
      padding: 5px 10px;
      color: var(--primary-dark);
      background: var(--soft-primary);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .face-text {
      max-width: 100%;
      margin: 0;
      color: var(--text);
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 750;
      line-height: 1.7;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .face-image {
      max-width: 100%;
      max-height: 170px;
      object-fit: contain;
      border-radius: 14px;
    }

    .flip-hint { color: var(--muted); font-size: 13px; }

    .study-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }

    .card-position { min-width: 72px; color: var(--muted); text-align: center; }

    .list-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 12px;
      font-size: 17px;
    }

    .card-list { display: grid; gap: 8px; max-height: 440px; overflow: auto; }

    .card-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fff;
    }

    .card-row.selected { border-color: #9aa5ff; background: #f7f8ff; }

    .card-row-main {
      flex: 1;
      min-width: 0;
      padding: 4px;
      color: var(--text);
      text-align: start;
      background: transparent;
      border: 0;
    }

    .card-row-main strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-row-main small { color: var(--muted); }
    .empty-state { padding: 28px 14px; text-align: center; color: var(--muted); }
    .empty-state .empty-icon { margin-bottom: 8px; font-size: 32px; }

    .quiz-box { max-width: 720px; margin: auto; }
    .quiz-progress { margin-bottom: 14px; color: var(--muted); font-weight: 650; }
    .quiz-question { margin: 0 0 18px; font-size: 23px; line-height: 1.6; }
    .quiz-image { display: block; max-width: 100%; max-height: 220px; margin: 0 auto 16px; border-radius: 16px; }
    .choices { display: grid; gap: 10px; }
    .choice {
      width: 100%;
      padding: 13px 15px;
      color: var(--text);
      text-align: start;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 13px;
      transition: .18s;
    }

    .choice:hover:not(:disabled) { border-color: var(--primary); background: #f8f8ff; }
    .choice:disabled { cursor: default; }
    .choice.correct { border-color: #9bd9bb; background: var(--soft-green); }
    .choice.wrong { border-color: #f0aaa5; background: var(--soft-red); }
    .quiz-feedback { min-height: 28px; margin: 14px 0; font-weight: 750; }
    .quiz-feedback.correct-text { color: var(--green); }
    .quiz-feedback.wrong-text { color: var(--red); }
    .mistake-count { color: var(--red); font-size: 12px; }

    dialog {
      width: min(560px, calc(100% - 28px));
      padding: 0;
      color: var(--text);
      border: 0;
      border-radius: 20px;
      box-shadow: 0 25px 80px rgba(15, 25, 45, .25);
    }

    dialog::backdrop { background: rgba(20, 28, 44, .48); backdrop-filter: blur(3px); }

    .dialog-content { padding: 23px; }
    .dialog-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 17px; }
    .dialog-header h2 { margin: 0; font-size: 21px; }

    .field { display: grid; gap: 7px; margin-bottom: 15px; }
    .field label { font-size: 14px; font-weight: 750; }
    .field input, .field textarea {
      width: 100%;
      padding: 11px 12px;
      color: var(--text);
      background: #fbfcfe;
      border: 1px solid #dfe4ed;
      border-radius: 11px;
      outline: none;
    }

    .field input:focus, .field textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(91, 108, 249, .12);
    }

    .field textarea { min-height: 90px; resize: vertical; }
    .field input[type="file"] { background: #fff; }
    .image-note { color: var(--muted); font-size: 12px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

    @media (max-width: 900px) {
      .app-layout, [dir="ltr"] .app-layout { grid-template-columns: 220px minmax(0, 1fr); }
      .study-layout { grid-template-columns: 1fr; }
    }

    @media (max-width: 650px) {
      .app-header { padding: 12px 15px; }
      .app-layout, [dir="ltr"] .app-layout { display: flex; flex-direction: column; }
      [dir="ltr"] .sidebar, [dir="ltr"] .workspace { order: initial; }
      .sidebar { padding: 14px; border-inline-end: 0; border-bottom: 1px solid var(--line); }
      .section-list { grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); }
      .workspace { padding: 18px 14px; }
      .workspace-top { flex-direction: column; }
      .flashcard, .flashcard-inner { min-height: 280px; }
      .flashcard-face { padding: 24px 20px; border-radius: 20px; }
      .panel { padding: 16px; }
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-icon">✦</span>
      <span id="brandTitle">بطاقاتي</span>
    </div>
    <div class="header-actions">
      <button class="button secondary small" id="languageButton">English</button>
      <button class="button secondary small" id="directionButton">↔ تغيير الاتجاه</button>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-heading" id="sectionsHeading">أقسام الدراسة</div>
      <div class="section-list" id="sectionList"></div>
      <button class="button secondary" id="addSectionButton" style="width:100%; margin-top:12px">＋ إضافة قسم</button>
    </aside>

    <main class="workspace">
      <div class="workspace-top">
        <div>
          <h1 id="pageTitle">بطاقاتي</h1>
          <p class="subtitle" id="pageSubtitle">أنشئ بطاقاتك وراجعها بطريقة ممتعة.</p>
        </div>
        <div class="toolbar">
          <button class="button" id="addCardButton">＋ إضافة بطاقة</button>
          <button class="button secondary" id="startQuizButton">🎲 ابدأ اختبارًا عشوائيًا</button>
        </div>
      </div>

      <nav class="tabs">
        <button class="tab active" data-mode="study" id="studyTab">📚 البطاقات</button>
        <button class="tab" data-mode="mistakes" id="mistakesTab">⚠️ الأخطاء</button>
        <button class="tab" data-mode="quiz" id="quizTab">🎲 الاختبار</button>
      </nav>

      <section id="view"></section>
    </main>
  </div>

  <dialog id="cardDialog">
    <form class="dialog-content" id="cardForm">
      <div class="dialog-header">
        <h2 id="cardDialogTitle">إضافة بطاقة</h2>
        <button type="button" class="icon-button" data-close-dialog="cardDialog" aria-label="إغلاق">✕</button>
      </div>

      <label class="field">
        <span id="questionLabel">السؤال</span>
        <textarea id="questionInput" required></textarea>
      </label>
      <label class="field">
        <span id="questionImageLabel">صورة السؤال (اختياري)</span>
        <input id="questionImageInput" type="file" accept="image/*">
        <span class="image-note" id="questionImageNote">يمكنك اختيار صورة من جهازك.</span>
      </label>

      <label class="field">
        <span id="answerLabel">الإجابة</span>
        <textarea id="answerInput" required></textarea>
      </label>
      <label class="field">
        <span id="answerImageLabel">صورة الإجابة (اختياري)</span>
        <input id="answerImageInput" type="file" accept="image/*">
        <span class="image-note" id="answerImageNote">تُحفظ الصور في IndexedDB.</span>
      </label>

      <div class="dialog-actions">
        <button type="button" class="button secondary" data-close-dialog="cardDialog" id="cancelCardButton">إلغاء</button>
        <button type="submit" class="button" id="saveCardButton">حفظ البطاقة</button>
      </div>
    </form>
  </dialog>

  <script>
    const translations = {
      ar: {
        brand: "بطاقاتي", sections: "أقسام الدراسة", addSection: "＋ إضافة قسم",
        cards: "البطاقات", mistakes: "⚠️ الأخطاء", quiz: "🎲 الاختبار",
        addCard: "＋ إضافة بطاقة", startQuiz: "🎲 ابدأ اختبارًا عشوائيًا",
        subtitle: "أنشئ بطاقاتك وراجعها بطريقة ممتعة.", question: "السؤال",
        answer: "الإجابة", questionImage: "صورة السؤال (اختياري)",
        answerImage: "صورة الإجابة (اختياري)", imageNote: "يمكنك اختيار صورة من جهازك.",
        imageStored: "تُحفظ الصور في IndexedDB.", cancel: "إلغاء",
        save: "حفظ البطاقة", edit: "تعديل البطاقة", noSections: "أضيفي قسمًا للبدء.",
        noCards: "لا توجد بطاقات في هذا القسم بعد.", addFirst: "أضيفي أول بطاقة",
        flipHint: "اضغط على البطاقة لقلبها", previous: "السابق", next: "التالي",
        card: "بطاقة", of: "من", editTitle: "تعديل بطاقة", addTitle: "إضافة بطاقة",
        rename: "إعادة تسمية القسم", deleteSection: "حذف القسم",
        deleteCard: "حذف البطاقة", confirmDeleteSection: "حذف هذا القسم وجميع بطاقاته؟",
        confirmDeleteCard: "حذف هذه البطاقة؟", sectionName: "اسم القسم الجديد:",
        newSectionName: "اسم القسم:", mistakesEmpty: "لا توجد أخطاء بعد. أحسنت!",
        mistakeCount: "عدد الأخطاء", noQuizCards: "أضيفي بطاقتين على الأقل لبدء الاختبار.",
        questionNumber: "السؤال", correct: "إجابة صحيحة! أحسنت.",
        incorrect: "إجابة غير صحيحة. ستجدين هذه البطاقة في قسم الأخطاء.",
        nextQuestion: "السؤال التالي", finishQuiz: "إنهاء الاختبار",
        quizDone: "انتهى الاختبار!", score: "النتيجة", tryAgain: "اختبار جديد",
        noAnswer: "لا توجد إجابة مكتوبة", selectSection: "اختاري قسمًا أولًا.",
        dirChanged: "↔ تغيير الاتجاه", front: "وجه السؤال", back: "وجه الإجابة",
        mistakesTitle: "البطاقات التي تحتاج إلى مراجعة"
      },
      en: {
        brand: "My Flashcards", sections: "STUDY SECTIONS", addSection: "＋ Add section",
        cards: "📚 Cards", mistakes: "⚠️ Mistakes", quiz: "🎲 Quiz",
        addCard: "＋ Add card", startQuiz: "🎲 Start random quiz",
        subtitle: "Create flashcards and study in a fun way.", question: "Question",
        answer: "Answer", questionImage: "Question image (optional)",
        answerImage: "Answer image (optional)", imageNote: "Choose an image from your device.",
        imageStored: "Images are saved in IndexedDB.", cancel: "Cancel",
        save: "Save card", edit: "Edit card", noSections: "Add a section to get started.",
        noCards: "This section has no cards yet.", addFirst: "Add your first card",
        flipHint: "Click the card to flip it", previous: "Previous", next: "Next",
        card: "Card", of: "of", editTitle: "Edit card", addTitle: "Add card",
        rename: "Rename section", deleteSection: "Delete section",
        deleteCard: "Delete card", confirmDeleteSection: "Delete this section and all its cards?",
        confirmDeleteCard: "Delete this card?", sectionName: "New section name:",
        newSectionName: "Section name:", mistakesEmpty: "No mistakes yet. Great job!",
        mistakeCount: "Mistakes", noQuizCards: "Add at least two cards to start a quiz.",
        questionNumber: "Question", correct: "Correct! Well done.",
        incorrect: "Not quite. This card was added to Mistakes.",
        nextQuestion: "Next question", finishQuiz: "Finish quiz",
        quizDone: "Quiz complete!", score: "Score", tryAgain: "New quiz",
        noAnswer: "No written answer", selectSection: "Select a section first.",
        dirChanged: "↔ Change direction", front: "Question side", back: "Answer side",
        mistakesTitle: "Cards to review"
      }
    };

    const stateKey = "flashcards_app_state_v1";
    let state = loadState();
    let lang = localStorage.getItem("flashcards_language") || "ar";
    let direction = localStorage.getItem("flashcards_direction") || (lang === "ar" ? "rtl" : "ltr");
    let mode = "study";
    let selectedCardId = null;
    let studyIndex = 0;
    let editingCardId = null;
    let quizCards = [];
    let quizIndex = 0;
    let quizScore = 0;
    let quizAnswered = false;
    let imageUrlCache = new Map();

    const $ = id => document.getElementById(id);
    const tr = key => translations[lang][key] || key;
    const makeId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2));

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(stateKey));
        if (saved && Array.isArray(saved.sections) && Array.isArray(saved.cards)) {
          return { sections: saved.sections, cards: saved.cards, mistakes: saved.mistakes || {} };
        }
      } catch (_) {}
      return {
        sections: [{ id: makeId(), name: "عام" }],
        cards: [],
        mistakes: {}
      };
    }

    function saveState() {
      localStorage.setItem(stateKey, JSON.stringify(state));
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[ch]);
    }

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("FlashcardsImagesDB", 1);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains("images")) {
            request.result.createObjectStore("images");
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function putImage(blob) {
      const db = await openDatabase();
      const id = makeId();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("images", "readwrite");
        tx.objectStore("images").put(blob, id);
        tx.oncomplete = () => resolve(id);
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getImageUrl(id) {
      if (!id) return "";
      if (imageUrlCache.has(id)) return imageUrlCache.get(id);
      try {
        const db = await openDatabase();
        const blob = await new Promise((resolve, reject) => {
          const request = db.transaction("images", "readonly").objectStore("images").get(id);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
        if (!blob) return "";
        const url = URL.createObjectURL(blob);
        imageUrlCache.set(id, url);
        return url;
      } catch (_) {
        return "";
      }
    }

    async function deleteImage(id) {
      if (!id) return;
      const url = imageUrlCache.get(id);
      if (url) URL.revokeObjectURL(url);
      imageUrlCache.delete(id);
      try {
        const db = await openDatabase();
        await new Promise(resolve => {
          const tx = db.transaction("images", "readwrite");
          tx.objectStore("images").delete(id);
          tx.oncomplete = resolve;
          tx.onerror = resolve;
        });
      } catch (_) {}
    }

    function currentSection() {
      return state.sections.find(section => section.id === state.activeSectionId) || state.sections[0];
    }

    function cardsForSection(sectionId) {
      return state.cards.filter(card => card.sectionId === sectionId);
    }

    function setLanguage(newLang) {
      lang = newLang;
      localStorage.setItem("flashcards_language", lang);
      direction = lang === "ar" ? "rtl" : "ltr";
      localStorage.setItem("flashcards_direction", direction);
      render();
    }

    function applyLanguage() {
      document.documentElement.lang = lang;
      document.documentElement.dir = direction;
      $("brandTitle").textContent = tr("brand");
      $("sectionsHeading").textContent = tr("sections");
      $("addSectionButton").textContent = tr("addSection");
      $("addCardButton").textContent = tr("addCard");
      $("startQuizButton").textContent = tr("startQuiz");
      $("studyTab").textContent = tr("cards");
      $("mistakesTab").textContent = tr("mistakes");
      $("quizTab").textContent = tr("quiz");
      $("languageButton").textContent = lang === "ar" ? "English" : "العربية";
      $("directionButton").textContent = tr("dirChanged");
      $("questionLabel").textContent = tr("question");
      $("answerLabel").textContent = tr("answer");
      $("questionImageLabel").textContent = tr("questionImage");
      $("answerImageLabel").textContent = tr("answerImage");
      $("questionImageNote").textContent = tr("imageNote");
      $("answerImageNote").textContent = tr("imageStored");
      $("cancelCardButton").textContent = tr("cancel");
      $("saveCardButton").textContent = tr("save");
    }

    function renderSections() {
      const list = $("sectionList");
      list.innerHTML = "";

      state.sections.forEach(section => {
        const count = cardsForSection(section.id).length;
        const item = document.createElement("div");
        item.className = "section-item" + (currentSection()?.id === section.id && mode !== "mistakes" ? " active" : "");
        item.innerHTML = `
          <button class="section-select" data-action="select-section" data-id="${escapeHTML(section.id)}">
            ${escapeHTML(section.name)} <span class="section-count">${count}</span>
          </button>
          <span class="section-tools">
            <button class="icon-button" title="${escapeHTML(tr("rename"))}" data-action="rename-section" data-id="${escapeHTML(section.id)}">✎</button>
            <button class="icon-button" title="${escapeHTML(tr("deleteSection"))}" data-action="delete-section" data-id="${escapeHTML(section.id)}">×</button>
          </span>`;
        list.appendChild(item);
      });
    }

    async function imageMarkup(id, className) {
      const url = await getImageUrl(id);
      return url ? `<img class="${className}" src="${url}" alt="">` : "";
    }

    function setMode(newMode) {
      mode = newMode;
      document.querySelectorAll(".tab").forEach(tab => tab.classList.toggle("active", tab.dataset.mode === mode));
      if (mode === "quiz" && !quizCards.length) startQuiz();
      render();
    }

    async function renderStudy() {
      const section = currentSection();
      if (!section) {
        $("view").innerHTML = `<div class="panel empty-state">${tr("noSections")}</div>`;
        return;
      }

      const cards = cardsForSection(section.id);
      if (!cards.length) {
        $("view").innerHTML = `
          <div class="panel empty-state">
            <div class="empty-icon">🗂️</div>
            <p>${tr("noCards")}</p>
            <button class="button" data-action="add-card">${tr("addFirst")}</button>
          </div>`;
        return;
      }

      if (!cards.some(card => card.id === selectedCardId)) {
        selectedCardId = cards[Math.min(studyIndex, cards.length - 1)].id;
      }
      studyIndex = Math.max(0, cards.findIndex(card => card.id === selectedCardId));
      const selected = cards[studyIndex];

      const qImage = await imageMarkup(selected.qImage, "face-image");
      const aImage = await imageMarkup(selected.aImage, "face-image");

      $("view").innerHTML = `
        <div class="study-layout">
          <div class="card-stage">
            <div class="flashcard" id="flashcard" role="button" tabindex="0" aria-label="${escapeHTML(tr("flipHint"))}">
              <div class="flashcard-inner">
                <div class="flashcard-face front">
                  <span class="face-label">${tr("front")}</span>
                  <p class="face-text">${escapeHTML(selected.question)}</p>
                  ${qImage}
                  <span class="flip-hint">${tr("flipHint")}</span>
                </div>
                <div class="flashcard-face back">
                  <span class="face-label">${tr("back")}</span>
                  <p class="face-text">${escapeHTML(selected.answer)}</p>
                  ${aImage}
                  <span class="flip-hint">${tr("flipHint")}</span>
                </div>
              </div>
            </div>
            <div class="study-controls">
              <button class="button secondary small" data-action="previous">${tr("previous")}</button>
              <span class="card-position">${tr("card")} ${studyIndex + 1} ${tr("of")} ${cards.length}</span>
              <button class="button secondary small" data-action="next">${tr("next")}</button>
            </div>
          </div>

          <div class="panel">
            <h2 class="list-heading"><span>${escapeHTML(section.name)}</span><span>${cards.length}</span></h2>
            <div class="card-list">
              ${cards.map(card => `
                <div class="card-row ${card.id === selected.id ? "selected" : ""}">
                  <button class="card-row-main" data-action="select-card" data-id="${escapeHTML(card.id)}">
                    <strong>${escapeHTML(card.question || tr("question"))}</strong>
                    <small>${escapeHTML(card.answer || tr("answer"))}</small>
                  </button>
                  <button class="icon-button" title="${escapeHTML(tr("edit"))}" data-action="edit-card" data-id="${escapeHTML(card.id)}">✎</button>
                  <button class="icon-button" title="${escapeHTML(tr("deleteCard"))}" data-action="delete-card" data-id="${escapeHTML(card.id)}">×</button>
                </div>`).join("")}
            </div>
          </div>
        </div>`;

      const flashcard = $("flashcard");
      flashcard.addEventListener("click", () => flashcard.classList.toggle("is-flipped"));
      flashcard.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          flashcard.classList.toggle("is-flipped");
        }
      });
    }

    async function renderMistakes() {
      const mistakes = state.cards.filter(card => (state.mistakes[card.id] || 0) > 0);
      if (!mistakes.length) {
        $("view").innerHTML = `<div class="panel empty-state"><div class="empty-icon">✨</div><p>${tr("mistakesEmpty")}</p></div>`;
        return;
      }

      const rows = await Promise.all(mistakes.map(async card => {
        const section = state.sections.find(item => item.id === card.sectionId);
        const image = await imageMarkup(card.qImage, "face-image");
        return `
          <div class="card-row">
            <button class="card-row-main" data-action="study-mistake" data-id="${escapeHTML(card.id)}">
              <strong>${escapeHTML(card.question)}</strong>
              <small>${escapeHTML(section?.name || "")} · ${tr("mistakeCount")}: ${state.mistakes[card.id]}</small>
              ${image}
            </button>
            <button class="icon-button" title="${escapeHTML(tr("edit"))}" data-action="edit-card" data-id="${escapeHTML(card.id)}">✎</button>
          </div>`;
      }));

      $("view").innerHTML = `
        <div class="panel">
          <h2 class="list-heading">${tr("mistakesTitle")} <span class="mistake-count">${mistakes.length}</span></h2>
          <div class="card-list">${rows.join("")}</div>
        </div>`;
    }

    async function renderQuiz() {
      if (!quizCards.length) {
        $("view").innerHTML = `<div class="panel empty-state"><div class="empty-icon">🎲</div><p>${tr("noQuizCards")}</p></div>`;
        return;
      }

      if (quizIndex >= quizCards.length) {
        $("view").innerHTML = `
          <div class="panel empty-state">
            <div class="empty-icon">🎉</div>
            <h2>${tr("quizDone")}</h2>
            <p>${tr("score")}: ${quizScore} / ${quizCards.length}</p>
            <button class="button" data-action="restart-quiz">${tr("tryAgain")}</button>
          </div>`;
        return;
      }

      const card = quizCards[quizIndex];
      const otherCards = state.cards.filter(item => item.id !== card.id);
      const wrongOptions = shuffle(otherCards).slice(0, 3);
      const options = shuffle([card, ...wrongOptions]);
      const image = await imageMarkup(card.qImage, "quiz-image");

      $("view").innerHTML = `
        <div class="panel quiz-box">
          <div class="quiz-progress">${tr("questionNumber")} ${quizIndex + 1} ${tr("of")} ${quizCards.length}</div>
          ${image}
          <h2 class="quiz-question">${escapeHTML(card.question)}</h2>
          <div class="choices">
            ${options.map(option => `
              <button class="choice" data-action="answer-quiz" data-id="${escapeHTML(option.id)}">
                ${escapeHTML(option.answer || tr("noAnswer"))}
              </button>`).join("")}
          </div>
          <div class="quiz-feedback" id="quizFeedback"></div>
          <div style="text-align:end">
            <button class="button" id="nextQuizButton" data-action="next-quiz" hidden>${quizIndex === quizCards.length - 1 ? tr("finishQuiz") : tr("nextQuestion")}</button>
          </div>
        </div>`;
    }

    async function render() {
      applyLanguage();
      renderSections();

      $("pageTitle").textContent = mode === "mistakes"
        ? tr("mistakes")
        : (currentSection()?.name || tr("brand"));
      $("pageSubtitle").textContent = mode === "quiz" ? tr("quiz") : tr("subtitle");
      $("addCardButton").hidden = mode !== "study";
      $("startQuizButton").hidden = mode === "quiz";

      if (mode === "study") await renderStudy();
      else if (mode === "mistakes") await renderMistakes();
      else await renderQuiz();
    }

    function shuffle(array) {
      const result = [...array];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function startQuiz() {
      if (state.cards.length < 2) {
        mode = "quiz";
        quizCards = [];
        render();
        return;
      }
      quizCards = shuffle(state.cards);
      quizIndex = 0;
      quizScore = 0;
      quizAnswered = false;
      mode = "quiz";
      document.querySelectorAll(".tab").forEach(tab => tab.classList.toggle("active", tab.dataset.mode === "quiz"));
      render();
    }

    function openCardDialog(card = null) {
      if (!currentSection() && !card) {
        alert(tr("selectSection"));
        return;
      }
      editingCardId = card?.id || null;
      $("cardDialogTitle").textContent = card ? tr("editTitle") : tr("addTitle");
      $("saveCardButton").textContent = card ? tr("save") : tr("save");
      $("questionInput").value = card?.question || "";
      $("answerInput").value = card?.answer || "";
      $("questionImageInput").value = "";
      $("answerImageInput").value = "";
      $("cardDialog").showModal();
    }

    async function saveCard(event) {
      event.preventDefault();
      const question = $("questionInput").value.trim();
      const answer = $("answerInput").value.trim();
      if (!question || !answer) return;

      let card = editingCardId ? state.cards.find(item => item.id === editingCardId) : null;
      const qFile = $("questionImageInput").files[0];
      const aFile = $("answerImageInput").files[0];

      if (!card) {
        card = { id: makeId(), sectionId: currentSection().id, question, answer, qImage: "", aImage: "" };
        state.cards.push(card);
      } else {
        card.question = question;
        card.answer = answer;
      }

      try {
        if (qFile) {
          await deleteImage(card.qImage);
          card.qImage = await putImage(qFile);
        }
        if (aFile) {
          await deleteImage(card.aImage);
          card.aImage = await putImage(aFile);
        }
      } catch (_) {
        alert("تعذر حفظ الصورة. جرّبي صورة أصغر.");
      }

      saveState();
      $("cardDialog").close();
      selectedCardId = card.id;
      mode = "study";
      render();
    }

    async function deleteCard(id) {
      if (!confirm(tr("confirmDeleteCard"))) return;
      const card = state.cards.find(item => item.id === id);
      if (card) {
        await deleteImage(card.qImage);
        await deleteImage(card.aImage);
      }
      state.cards = state.cards.filter(item => item.id !== id);
      delete state.mistakes[id];
      if (selectedCardId === id) selectedCardId = null;
      saveState();
      render();
    }

    document.addEventListener("click", async event => {
      const tab = event.target.closest(".tab");
      if (tab) {
        setMode(tab.dataset.mode);
        return;
      }

      const actionButton = event.target.closest("[data-action]");
      if (!actionButton) return;
      const action = actionButton.dataset.action;
      const id = actionButton.dataset.id;

      if (action === "add-card") openCardDialog();
      if (action === "select-section") {
        state.activeSectionId = id;
        selectedCardId = null;
        studyIndex = 0;
        mode = "study";
        render();
      }
      if (action === "select-card") {
        selectedCardId = id;
        render();
      }
      if (action === "previous" || action === "next") {
        const cards = cardsForSection(currentSection()?.id);
        if (!cards.length) return;
        const current = Math.max(0, cards.findIndex(card => card.id === selectedCardId));
        const offset = action === "next" ? 1 : -1;
        selectedCardId = cards[(current + offset + cards.length) % cards.length].id;
        render();
      }
      if (action === "edit-card") {
        const card = state.cards.find(item => item.id === id);
        if (card) openCardDialog(card);
      }
      if (action === "delete-card") deleteCard(id);

      if (action === "rename-section") {
        const section = state.sections.find(item => item.id === id);
        const name = prompt(tr("sectionName"), section?.name || "");
        if (name?.trim()) {
          section.name = name.trim();
          saveState();
          render();
        }
      }

      if (action === "delete-section") {
        if (!confirm(tr("confirmDeleteSection"))) return;
        const removed = state.cards.filter(card => card.sectionId === id);
        for (const card of removed) {
          await deleteImage(card.qImage);
          await deleteImage(card.aImage);
          delete state.mistakes[card.id];
        }
        state.cards = state.cards.filter(card => card.sectionId !== id);
        state.sections = state.sections.filter(section => section.id !== id);
        if (!state.sections.length) state.sections.push({ id: makeId(), name: lang === "ar" ? "عام" : "General" });
        if (state.activeSectionId === id) state.activeSectionId = state.sections[0].id;
        selectedCardId = null;
        saveState();
        render();
      }

      if (action === "study-mistake") {
        const card = state.cards.find(item => item.id === id);
        if (card) {
          state.activeSectionId = card.sectionId;
          selectedCardId = card.id;
          mode = "study";
          render();
        }
      }

      if (action === "restart-quiz") startQuiz();

      if (action === "answer-quiz" && !quizAnswered) {
        quizAnswered = true;
        const current = quizCards[quizIndex];
        const isCorrect = id === current.id;
        if (isCorrect) {
          quizScore++;
        } else {
          state.mistakes[current.id] = (state.mistakes[current.id] || 0) + 1;
          saveState();
        }

        document.querySelectorAll(".choice").forEach(button => {
          button.disabled = true;
          if (button.dataset.id === current.id) button.classList.add("correct");
          else if (button.dataset.id === id) button.classList.add("wrong");
        });

        const feedback = $("quizFeedback");
        feedback.textContent = isCorrect ? tr("correct") : tr("incorrect");
        feedback.className = "quiz-feedback " + (isCorrect ? "correct-text" : "wrong-text");
        $("nextQuizButton").hidden = false;
      }

      if (action === "next-quiz") {
        quizIndex++;
        quizAnswered = false;
        render();
      }
    });

    $("addSectionButton").addEventListener("click", () => {
      const name = prompt(tr("newSectionName"));
      if (!name?.trim()) return;
      const section = { id: makeId(), name: name.trim() };
      state.sections.push(section);
      state.activeSectionId = section.id;
      selectedCardId = null;
      mode = "study";
      saveState();
      render();
    });

    $("addCardButton").addEventListener("click", () => openCardDialog());
    $("startQuizButton").addEventListener("click", startQuiz);
    $("cardForm").addEventListener("submit", saveCard);

    $("languageButton").addEventListener("click", () => setLanguage(lang === "ar" ? "en" : "ar"));
    $("directionButton").addEventListener("click", () => {
      direction = direction === "rtl" ? "ltr" : "rtl";
      localStorage.setItem("flashcards_direction", direction);
      render();
    });

    document.querySelectorAll("[data-close-dialog]").forEach(button => {
      button.addEventListener("click", () => $(button.dataset.closeDialog).close());
    });

    if (!state.activeSectionId && state.sections.length) state.activeSectionId = state.sections[0].id;
    saveState();
    render();
  </script>
</body>
</html>
